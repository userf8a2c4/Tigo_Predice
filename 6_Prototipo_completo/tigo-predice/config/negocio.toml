# =============================================================================
# Tigo Predice v02 — ÚNICA fuente de verdad de supuestos y parámetros
#
# Cada supuesto tiene: unidad, bajo / base / alto, fuente y nota.
#   fuente = "supuesto a validar" | "benchmark público" | "dato Tigo"
# "Pon tus números" en la app reemplaza valores y los marca como "dato Tigo".
# Fuentes detalladas: docs/fuentes.md
# =============================================================================

[general]
semilla = 42
fecha_corte = "2026-10-12"          # "hoy" dentro de la simulación
clientes_simulados = 20000

# ----------------------------------------------------------------------------
# FASE 1 · PILOTO DE FALLAS MASIVAS DE RED
# ----------------------------------------------------------------------------
[piloto]
ciudad = "San Pedro Sula"
dias = 60
pct_control = 0.15                  # grupo control aleatorio que NO recibe aviso
sal_asignacion = "tigo-predice-piloto-v02"
horizonte_horas = 72                # métrica norte: llamadas en 72 h tras la falla
mensajes_por_afectado = 2           # aviso + cierre al restablecer
pct_fallas_con_eta = 0.6            # % de fallas en que el NOC tiene hora estimada
efecto_simulado = 0.20              # efecto "verdadero" SOLO para la simulación sintética
optout_simulado = 0.006             # tasa de opt-out SOLO para la simulación sintética
# Criterios de decisión al día 60
go_reduccion_min = 0.10             # GO si la reducción relativa de llamadas >= 10 %
go_optout_max = 0.02                # ... y opt-out < 2 %
alfa = 0.05                         # ... y diferencia significativa (p < alfa)
poder = 0.80                        # poder estadístico objetivo para el tamaño de muestra
holdout_escala = 0.05               # al escalar se deja un 5 % de control para seguir midiendo

