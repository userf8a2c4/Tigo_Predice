# ----------------------------------------------------------------------------
# FRENTE HOGAR · ATENCIÓN PROACTIVA (v03)
# La IA lee la telemetría de los módems, marca los hogares que van a fallar y se
# corrige a distancia antes de que el cliente llame o haya que mandar un técnico.
# ----------------------------------------------------------------------------
[hogar]
hogares_simulados = 12000
horizonte_dias = 7                  # la IA predice: llamada técnica o visita en los próximos 7 días
pct_marcados_semana = 0.02          # presupuesto: cada semana se actúa sobre el 2 % de hogares con más riesgo
mensajes_por_marcado = 1            # un WhatsApp: "lo corregimos a distancia" u "ofrecemos visita"
sal_asignacion = "tigo-predice-hogar-v03"
exito_remoto_simulado = 0.70        # SOLO simulación: % de problemas resolubles a distancia que se corrigen
evita_llamada_fisico_simulado = 0.5 # SOLO simulación: en problemas físicos, avisar evita la llamada (no la visita)
optout_simulado = 0.004             # SOLO simulación
go_reduccion_visitas_min = 0.15     # GO si las visitas en hogares marcados bajan >= 15 % vs. control
go_ia_vs_regla_min = 1.3            # y la IA captura >= 1.3x lo que captura la regla de umbrales (si no, se usa la regla)

[supuestos.hogares_piloto]
unidad = "hogares (fibra/HFC) en la ciudad piloto"
bajo = 25000
base = 40000
alto = 50000
fuente = "supuesto a validar"
